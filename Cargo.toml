[package]
name = "metamesh-plugin-fast-full-hash"
version = "1.0.0"
edition = "2021"
description = "High-performance file hashing plugin for MetaMesh"
authors = ["MetaMesh"]

[dependencies]
# HTTP server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Hashing
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1.4"
sha3 = "0.10"

# CID/Multihash
cid = "0.11"
multihash = "0.19"
unsigned-varint = "0.8"

# BitTorrent v2 bencoding
bendy = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
